name: Apply uploaded Front Desk index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-uploaded-index.yml'

permissions:
  contents: write

jobs:
  apply-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and capture diagnostics
        id: patch
        shell: bash
        run: |
          set +e
          python tools/apply_uploaded_index_patch.py > patch-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> patch-diagnostic.txt
          if [ "$code" -ne 0 ]; then
            git checkout -- index.html
          fi
          exit 0

      - name: Commit diagnostics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-diagnostic.txt
          git commit -m "Capture index patch diagnostics"
          git push
