name: Apply uploaded Front Desk index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-uploaded-index.yml'

permissions:
  contents: write

jobs:
  inspect-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate and capture diff
        shell: bash
        run: |
          set +e
          python tools/apply_uploaded_index_patch.py > candidate-diagnostic.txt 2>&1
          python tools/finish_index_css_patch.py >> candidate-diagnostic.txt 2>&1
          git diff -- index.html > candidate.patch
          git checkout -- index.html
          set -e

      - name: Commit small diagnostic diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate.patch candidate-diagnostic.txt
          git commit -m "Capture candidate index diff"
          git push
